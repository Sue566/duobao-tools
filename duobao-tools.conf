
    # duobao-tools项目服务器配置
    server {
        # 监听80端口
        listen 80;
        
        # 服务器名称，可以是域名或IP地址
        server_name 8.130.134.230;
        
        # 网站根目录
        root /www/wwwroot/sujx/myprojects/duobao-tools;
        
        # 默认索引文件
        index index.html;
        
        # 字符集配置
        charset utf-8;
        
        # 静态文件缓存设置
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
        
        # 主要位置配置
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # 404错误页面
        error_page 404 /404.html;
        location = /404.html {
            root /www/wwwroot/sujx/myprojects/duobao-tools;
            internal;
        }
        
        # 50x错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /www/wwwroot/sujx/myprojects/duobao-tools;
            internal;
        }
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
